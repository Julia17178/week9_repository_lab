# Week 9 lab — the workflow file the class builds together, line by line.
# Python version shown; swap the "install" / "test" steps for your language
# (see the language reference guides for Java/C++/JS equivalents).

name: Run Tests                 # <- WORKFLOW: the whole file is one workflow

on: [push]                      # <- EVENT (TRIGGER): runs on every push

jobs:                           # <- JOB: a named unit of work
  test:
    runs-on: ubuntu-latest      # <- RUNNER: the machine that executes this job
    steps:                      # <- STEPS: individual tasks inside the job
      - uses: actions/checkout@v4      # <- ACTION: a reusable, pre-packaged step
      - uses: actions/setup-python@v5  # <- ACTION
        with:
          python-version: "3.11"
      - run: pip install pytest        # <- STEP (a plain shell command)
      - run: pytest                    # <- STEP (a plain shell command)
