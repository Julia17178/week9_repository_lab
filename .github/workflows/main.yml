# Week 10 lab — Multiply Your Environments
name: Run Tests

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    # 👇 THIS STRATEGY BLOCK TELLS GITHUB TO RUN MULTIPLE VERSIONS IN PARALLEL
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4
      
      # 👇 MULTIPLY: THIS PLUGS IN THE VERSIONS FROM YOUR MATRIX
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          
      - run: pip install pytest
      - run: |
          cd week9_pipeline_lab
          pytest
